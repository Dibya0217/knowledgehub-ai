spring:
  application:
    name: knowledgehub-ai
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      ssl:
        enabled: ${REDIS_TLS:false}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  ai:
    model:
      embedding: ${EMBEDDING_PROVIDER:ollama}
      chat: ${AI_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2}
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}
        collection-name: ${QDRANT_COLLECTION:knowledge_vectors}
        api-key: ${QDRANT_API_KEY:}
        use-tls: ${QDRANT_TLS:false}
        initialize-schema: true
        dimensions: ${EMBEDDING_DIMENSIONS:768}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  info:
    env:
      enabled: true

info:
  app:
    name: KnowledgeHub AI
    version: ${spring.application.version:1.0.0}
    description: RAG-powered knowledge management and chat platform

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

resilience4j:
  retry:
    instances:
      llm:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.ai.retry.NonTransientAiException
  circuitbreaker:
    instances:
      llm:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900000
    refresh-token-expiry: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  ai:
    provider: ${AI_PROVIDER:ollama}
    embedding-provider: ${EMBEDDING_PROVIDER:ollama}
  storage:
    type: ${STORAGE_TYPE:local}
    location: ${STORAGE_PATH:./uploads}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:us-east-1}
