spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/knowledgehub
    username: knowledgehub
    password: knowledgehub
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  flyway:
    enabled: true

logging:
  level:
    com.dibya.knowledgehub: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: local-dev-secret-min-32-chars-long-replace-in-prod
  cors:
    allowed-origins: http://localhost:5173
  ai:
    provider: ollama
    embedding-provider: ollama
  storage:
    location: ./uploads
