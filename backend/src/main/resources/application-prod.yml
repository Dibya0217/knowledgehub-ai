spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS}
      ssl:
        enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope: email, profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: email
  ai:
    model:
      chat: openai
      embedding: nomic
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    vectorstore:
      qdrant:
        use-tls: true

logging:
  level:
    root: WARN
    com.dibya.knowledgehub: INFO

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  ai:
    provider: groq
    embedding-provider: nomic
    nomic:
      api-key: ${NOMIC_API_KEY:}
      model: ${NOMIC_MODEL:nomic-embed-text-v1.5}
  storage:
    type: ${STORAGE_TYPE:local}
    location: ${STORAGE_PATH:/tmp/uploads}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:onboarding@resend.dev}
  frontend-url: ${FRONTEND_URL:https://knowledgehub-ai-app.netlify.app}
