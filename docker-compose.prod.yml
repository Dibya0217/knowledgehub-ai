services:

  postgres:
    image: postgres:16-alpine
    container_name: knowledgehub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-knowledgehub}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: knowledgehub-redis
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: knowledgehub-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  app:
    image: knowledgehub-backend:latest
    container_name: knowledgehub-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-knowledgehub}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ${REDIS_PASS}
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: 6334
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STORAGE_PATH: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    image: knowledgehub-frontend:latest
    container_name: knowledgehub-frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: knowledgehub-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: knowledgehub-grafana
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-admin}
    depends_on:
      - prometheus
    restart: always

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uploads_data:
  grafana_data:
